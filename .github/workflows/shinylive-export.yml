name: Build Shinylive demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      LMPLOT_EXPLICIT_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libpng-dev libtiff5-dev libjpeg-dev libgit2-dev libglpk-dev libicu-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Install export tools separately and export
        shell: Rscript {0}
        run: |
          dir.create(".build-tools")
          build_lib <- normalizePath(".build-tools")
          install.packages("remotes", lib = build_lib, repos = "https://cloud.r-project.org")
          .libPaths(c(build_lib, .libPaths()))
          remotes::install_version("shinylive", version = "0.5.0", lib = build_lib,
                                   repos = "https://cloud.r-project.org", upgrade = "never")
          # Explicit libpath bypasses the native project startup in the exporter.
          callr::rscript("scripts/export_shinylive.R", cmdargs = "--vanilla",
                         args = "site", libpath = .libPaths(), show = TRUE)
      - uses: actions/upload-artifact@v4
        with:
          name: lmplot-shinylive-site
          path: site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
