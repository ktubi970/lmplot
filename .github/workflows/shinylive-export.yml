name: Deploy Shinylive to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      LMPLOT_EXPLICIT_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libpng-dev libtiff5-dev libjpeg-dev libgit2-dev libglpk-dev libicu-dev libarchive-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Install export tools separately and export
        shell: Rscript {0}
        run: |
          dir.create(".build-tools")
          build_lib <- normalizePath(".build-tools")
          install.packages("remotes", lib = build_lib, repos = "https://cloud.r-project.org")
          .libPaths(c(build_lib, .libPaths()))
          remotes::install_version("shinylive", version = "0.5.0", lib = build_lib,
                                   repos = "https://cloud.r-project.org", upgrade = "never")
          # Explicit libpath bypasses the native project startup in the exporter.
          callr::rscript("scripts/export_shinylive.R", cmdargs = "site",
                         libpath = .libPaths(), show = TRUE,
                         system_profile = FALSE, user_profile = FALSE)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Upload Shinylive archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmplot-shinylive-site
          path: site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
