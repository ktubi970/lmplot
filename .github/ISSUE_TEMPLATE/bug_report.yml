name: Bug Report
description: Report a bug, unexpected calculation, or rendering issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve it.
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: model_family
    attributes:
      label: Model Family & Configuration
      description: Which model and link function was selected when the issue occurred?
      options:
        - "lm_2d (Simple LM 2D, identity)"
        - "lm_3d (Multiple LM 3D, identity)"
        - "glm_binomial_2d (Binomial 2D: logit / probit / cloglog)"
        - "glm_binomial (Binomial 3D: logit / probit / cloglog)"
        - "glm_poisson (Poisson: log / identity / sqrt)"
        - "glm_gamma (Gamma: inverse / log / identity)"
        - "glmm (Gaussian GLMM: identity)"
        - "N/A or Startup / Configuration issue"
    validations:
      required: true
  - type: dropdown
    id: data_source
    attributes:
      label: Data Source
      options:
        - "Deterministic simulation"
        - "Bundled real example"
        - "Expert mode (LMPLOT_TRUSTED_LOCAL=1)"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the problem.
      placeholder: |
        1. Select Model: ...
        2. Set Parameters: ...
        3. Click 'Run Analysis'
        4. Observe error or unexpected display
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Please share your R version, OS, browser, and package information.
      placeholder: |
        - OS: [e.g., Windows 11, Ubuntu 24.04, macOS 15]
        - R Version: [e.g., 4.6.0]
        - Browser: [e.g., Chrome 130, Firefox 131]
        - Execution mode: [Local Rscript / run.bat / Docker container]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Screenshots
      description: Paste any console or terminal output, or attach screenshots if applicable.
    validations:
      required: false
