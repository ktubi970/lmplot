services:
  lmplot:
    platform: linux/amd64
    build:
      context: "."
      dockerfile: Dockerfile
    image: lmplot:0.10.0-beta.1
    # An external ingress service joins this internal network and publishes
    # its own host port; Docker does not publish an internal-only endpoint.
    expose:
      - "3838"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/log/shiny-server:uid=997,gid=997,mode=0770
      - /var/lib/shiny-server:uid=997,gid=997,mode=0770
      - /var/run/shiny-server:uid=997,gid=997,mode=0770
      - /var/shiny-server/sockets:uid=997,gid=997,mode=0770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G
          pids: 256
        reservations:
          cpus: "0.50"
          memory: 512M
    networks:
      - lmplot_internal

networks:
  lmplot_internal:
    internal: true
