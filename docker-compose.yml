version: '3.8'

services:
  lmplot-streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lmplot_streamlit_app
    ports:
      - "8501:8501"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 3
